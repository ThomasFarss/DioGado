<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dio é gado?</title>
<style>
  :root{
    --sky-top:#ffd9a0;
    --sky-bottom:#ffb37a;
    --grass:#7cb342;
    --grass-dark:#558b2f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:'Segoe UI', Tahoma, sans-serif;
  }
  body{
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 55%, var(--grass) 55%, var(--grass-dark) 100%);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* nuvens */
  .cloud{
    position:absolute;
    background:rgba(255,255,255,0.85);
    border-radius:50px;
    filter:blur(1px);
    animation:drift linear infinite;
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,0.85);
    border-radius:50%;
  }
  @keyframes drift{
    from{transform:translateX(-150px);}
    to{transform:translateX(110vw);}
  }

  /* sol */
  .sun{
    position:absolute;
    top:6%;
    right:8%;
    width:70px;
    height:70px;
    border-radius:50%;
    background:radial-gradient(circle, #fff6d0 0%, #ffe066 60%, #ffcc33 100%);
    box-shadow:0 0 40px 20px rgba(255,204,51,0.55);
    animation:pulse 2.5s ease-in-out infinite;
    z-index:0;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1); box-shadow:0 0 40px 20px rgba(255,204,51,0.55);}
    50%{transform:scale(1.12); box-shadow:0 0 55px 28px rgba(255,204,51,0.7);}
  }

  /* passaro */
  .bird{
    position:absolute;
    font-size:20px;
    animation:flyacross linear infinite, flap 0.5s ease-in-out infinite alternate;
    z-index:1;
  }
  @keyframes flyacross{
    from{transform:translate(-60px, 0);}
    to{transform:translate(110vw, -40px);}
  }
  @keyframes flap{
    from{transform:translateY(0) scaleY(1);}
    to{transform:translateY(-6px) scaleY(0.85);}
  }

  /* boi */
  .cow{
    position:absolute;
    width:110px;
    animation:walk linear infinite;
    z-index:1;
    filter:drop-shadow(0 10px 6px rgba(0,0,0,0.25));
  }
  .cow img{
    display:block;
    width:100%;
    height:auto;
    animation:cowbob 0.4s ease-in-out infinite alternate;
  }
  @keyframes cowbob{
    from{transform:translateY(0) scaleX(-1);}
    to{transform:translateY(-8px) scaleX(-1);}
  }
  .cow.reverse img{
    animation-name:cowbobflip;
  }
  @keyframes cowbobflip{
    from{transform:translateY(0) scaleX(1);}
    to{transform:translateY(-8px) scaleX(1);}
  }
  @keyframes walk{
    from{transform:translateX(-160px);}
    50.01%{transform:translateX(105vw);}
    50.02%{transform:translateX(105vw);}
    to{transform:translateX(-160px);}
  }
  .cow.reverse{
    animation-direction:alternate;
  }

  /* grama detalhes */
  .grass-tuft{
    position:absolute;
    bottom:0;
    width:14px;
    height:22px;
    background:var(--grass-dark);
    border-radius:50% 50% 0 0;
  }

  /* card central */
  .card{
    position:relative;
    z-index:10;
    background:rgba(255,255,255,0.95);
    border-radius:24px;
    padding:40px 50px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    max-width:90vw;
    animation:cardIn 0.6s cubic-bezier(.34,1.56,.64,1), cardFloat 3.4s ease-in-out 0.6s infinite, cardGlow 2.6s ease-in-out 0.6s infinite;
    border:3px solid transparent;
  }
  @keyframes cardIn{
    from{transform:scale(0.7) translateY(30px); opacity:0;}
    to{transform:scale(1) translateY(0); opacity:1;}
  }
  @keyframes cardFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }
  @keyframes cardGlow{
    0%,100%{box-shadow:0 20px 50px rgba(0,0,0,0.25), 0 0 0 rgba(255,204,51,0);}
    50%{box-shadow:0 26px 60px rgba(0,0,0,0.3), 0 0 30px rgba(255,204,51,0.45);}
  }
  .card h1{
    margin:0 0 30px 0;
    font-size:clamp(22px, 5.5vw, 38px);
    color:#3e2723;
  }
  .card h1 span{
    color:#c0392b;
    display:inline-block;
    animation:wiggle 1.8s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(0deg);}
    10%{transform:rotate(-6deg);}
    20%{transform:rotate(6deg);}
    30%{transform:rotate(-4deg);}
    40%{transform:rotate(0deg);}
  }
  .dodge-zone{
    position:relative;
    width:100%;
    min-height:150px;
    overflow:hidden;
  }
  .btn-row{
    display:flex;
    gap:30px;
    justify-content:center;
    align-items:center;
    position:relative;
    min-height:70px;
    flex-wrap:wrap;
  }
  button{
    font-size:20px;
    font-weight:bold;
    padding:14px 36px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, left 0.18s ease, top 0.18s ease;
    touch-action:manipulation;
  }
  #simBtn{
    background:#43a047;
    color:white;
    box-shadow:0 6px 0 #2e7031;
    animation:simPulse 1.6s ease-in-out infinite;
  }
  @keyframes simPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  #simBtn:hover{
    transform:translateY(-2px) scale(1.06);
    box-shadow:0 8px 0 #2e7031;
  }
  #simBtn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #2e7031;
  }
  #naoBtn{
    background:#e53935;
    color:white;
    box-shadow:0 6px 0 #9d1c1c;
    position:absolute;
    transition: left 0.18s ease, top 0.18s ease, transform 0.15s ease;
  }

  /* popup */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    animation:fadeIn 0.25s ease;
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  .overlay.show{
    display:flex;
  }
  .popup{
    background:white;
    padding:40px 50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    animation:popBounce 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popBounce{
    0%{transform:scale(0.3) rotate(-8deg); opacity:0;}
    55%{transform:scale(1.12) rotate(3deg); opacity:1;}
    75%{transform:scale(0.95) rotate(-2deg);}
    100%{transform:scale(1) rotate(0deg);}
  }
  .popup .popup-icon{
    font-size:46px;
    display:block;
    margin-bottom:10px;
    animation:iconSpin 1s ease-in-out infinite;
  }
  @keyframes iconSpin{
    0%,100%{transform:rotate(-12deg) scale(1);}
    50%{transform:rotate(12deg) scale(1.15);}
  }
  .popup p{
    font-size:24px;
    font-weight:bold;
    color:#2e7031;
    margin:0 0 20px 0;
    animation:textGlow 1.4s ease-in-out infinite;
  }
  @keyframes textGlow{
    0%,100%{text-shadow:0 0 0 rgba(67,160,71,0);}
    50%{text-shadow:0 0 14px rgba(67,160,71,0.55);}
  }
  .popup button{
    background:#43a047;
    color:white;
    box-shadow:0 5px 0 #2e7031;
    animation:simPulse 1.6s ease-in-out infinite;
  }

  /* mobile */
  @media (max-width: 600px){
    body{
      align-items:flex-end;
      padding-bottom:6vh;
    }
    .card{
      padding:26px 22px;
      border-radius:20px;
      width:100%;
    }
    .card h1{
      margin-bottom:22px;
    }
    .dodge-zone{
      min-height:190px;
    }
    .btn-row{
      gap:18px;
      min-height:60px;
    }
    button{
      font-size:17px;
      padding:12px 26px;
      border-radius:12px;
    }
    .sun{
      width:46px;
      height:46px;
      top:4%;
      right:6%;
    }
    .cow{
      width:78px;
    }
    .popup{
      padding:30px 28px;
      max-width:85vw;
    }
    .popup p{
      font-size:20px;
    }
  }

  @media (max-height: 480px) and (orientation: landscape){
    body{ align-items:center; padding-bottom:0; }
    .card{ padding:18px 24px; }
    .card h1{ margin-bottom:14px; font-size:20px; }
    .dodge-zone{ min-height:100px; }
  }
</style>
</head>
<body>

  <div id="scene"></div>

  <div class="card">
    <h1>Dio é realmente <span>gado</span>?</h1>
    <div class="dodge-zone" id="dodgeZone">
      <div class="btn-row">
        <button id="simBtn">Sim</button>
      </div>
      <button id="naoBtn">Não</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="popup">
      <span class="popup-icon">🐮</span>
      <p>Ainda bem que sabe ...</p>
      <button id="closeBtn">Fechar</button>
    </div>
  </div>

<script>
  const scene = document.getElementById('scene');

  // sol
  const sun = document.createElement('div');
  sun.className = 'sun';
  scene.appendChild(sun);

  // passaros
  function createBird(top, duration, delay){
    const b = document.createElement('div');
    b.className = 'bird';
    b.style.top = top + '%';
    b.style.animationDuration = `${duration}s, 0.5s`;
    b.style.animationDelay = `${delay}s, 0s`;
    b.textContent = '🐦';
    scene.appendChild(b);
  }
  for(let i=0;i<3;i++){
    createBird(8 + Math.random()*20, 18 + Math.random()*10, -Math.random()*20);
  }

  // gerar bois
  function createCow(top, duration, delay, scale, reverse){
    const cow = document.createElement('div');
    cow.className = 'cow' + (reverse ? ' reverse' : '');
    cow.style.top = top + '%';
    cow.style.transform = `scale(${scale})`;
    cow.style.animationDuration = duration + 's';
    cow.style.animationDelay = delay + 's';

    cow.innerHTML = `<img src="cow.png" alt="boi">`;
    scene.appendChild(cow);
  }

  const cowSpots = [58, 65, 72, 80, 88];
  for(let i=0;i<9;i++){
    const top = cowSpots[i % cowSpots.length] + (Math.random()*4 - 2);
    const duration = 14 + Math.random()*10;
    const delay = -Math.random()*duration;
    const scale = 0.7 + Math.random()*0.6;
    createCow(top, duration, delay, scale, Math.random() > 0.5);
  }

  // nuvens
  function createCloud(top, width, duration, delay){
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.top = top + '%';
    c.style.width = width + 'px';
    c.style.height = (width*0.4) + 'px';
    c.style.animationDuration = duration + 's';
    c.style.animationDelay = delay + 's';
    scene.appendChild(c);
  }
  for(let i=0;i<5;i++){
    createCloud(5 + Math.random()*35, 80 + Math.random()*80, 40 + Math.random()*30, -Math.random()*40);
  }

  // tufos de grama
  for(let i=0;i<40;i++){
    const t = document.createElement('div');
    t.className = 'grass-tuft';
    t.style.left = (Math.random()*100) + '%';
    t.style.height = (14 + Math.random()*16) + 'px';
    scene.appendChild(t);
  }

  // botão "Não" foge do mouse, sempre dentro do card
  const naoBtn = document.getElementById('naoBtn');
  const simBtn = document.getElementById('simBtn');
  const dodgeZone = document.getElementById('dodgeZone');

  function placeNao(x, y){
    const zoneRect = dodgeZone.getBoundingClientRect();
    const btnW = naoBtn.offsetWidth || 90;
    const btnH = naoBtn.offsetHeight || 50;
    const maxX = Math.max(zoneRect.width - btnW, 0);
    const maxY = Math.max(zoneRect.height - btnH, 0);
    const clampedX = Math.min(Math.max(x, 0), maxX);
    const clampedY = Math.min(Math.max(y, 0), maxY);
    naoBtn.style.left = clampedX + 'px';
    naoBtn.style.top = clampedY + 'px';
  }

  function initNaoPosition(){
    const zoneRect = dodgeZone.getBoundingClientRect();
    const simRect = simBtn.getBoundingClientRect();
    const btnW = naoBtn.offsetWidth || 90;
    const startX = (simRect.right - zoneRect.left) + 20;
    const startY = (simRect.top - zoneRect.top);
    placeNao(startX, startY);
  }

  function jump(){
    const zoneRect = dodgeZone.getBoundingClientRect();
    const btnW = naoBtn.offsetWidth || 90;
    const btnH = naoBtn.offsetHeight || 50;
    const maxX = Math.max(zoneRect.width - btnW, 0);
    const maxY = Math.max(zoneRect.height - btnH, 0);
    placeNao(Math.random() * maxX, Math.random() * maxY);
  }

  window.addEventListener('load', initNaoPosition);
  window.addEventListener('resize', initNaoPosition);
  initNaoPosition();

  function dodge(e){
    const btnRect = naoBtn.getBoundingClientRect();
    const mouseX = e.clientX;
    const mouseY = e.clientY;

    const btnCenterX = btnRect.left + btnRect.width/2;
    const btnCenterY = btnRect.top + btnRect.height/2;
    const dist = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);

    if(dist < 90){
      jump();
    }
  }

  document.addEventListener('mousemove', dodge);
  naoBtn.addEventListener('mouseover', dodge);

  document.addEventListener('touchmove', function(e){
    const touch = e.touches[0];
    if(!touch) return;
    const btnRect = naoBtn.getBoundingClientRect();
    const btnCenterX = btnRect.left + btnRect.width/2;
    const btnCenterY = btnRect.top + btnRect.height/2;
    const dist = Math.hypot(touch.clientX - btnCenterX, touch.clientY - btnCenterY);
    if(dist < 70){
      jump();
    }
  }, {passive:true});

  naoBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    jump();
  }, {passive:false});

  // popup ao clicar em Sim
  const overlay = document.getElementById('overlay');
  simBtn.addEventListener('click', () => {
    overlay.classList.add('show');
  });
  document.getElementById('closeBtn').addEventListener('click', () => {
    overlay.classList.remove('show');
  });
</script>
</body>
</html>
