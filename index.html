<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dio é gado?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#ffcf8a;
    --sky-mid:#ffb37a;
    --sky-horizon:#ffdca6;
    --grass:#8bc24a;
    --grass-dark:#4f8a2f;
    --grass-deep:#3f7226;
    --wood:#8a5a34;
    --wood-dark:#6b4423;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    height:100dvh;
    overflow:hidden;
    font-family:'Nunito', 'Segoe UI', Tahoma, sans-serif;
  }
  body{
    background:linear-gradient(to bottom,
      var(--sky-top) 0%,
      var(--sky-mid) 38%,
      var(--sky-horizon) 54%,
      var(--grass) 56%,
      var(--grass-dark) 82%,
      var(--grass-deep) 100%);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }

  /* colinas ao fundo para dar profundidade */
  .hill{
    position:absolute;
    left:-10%;
    width:120%;
    border-radius:50%;
    background:var(--grass-dark);
    opacity:0.55;
  }
  .hill.h1{ top:52%; height:80px; }
  .hill.h2{ top:56%; height:70px; background:var(--grass-deep); opacity:0.4; }

  /* celeiro ao fundo */
  .barn{
    position:absolute;
    bottom:14%;
    left:6%;
    width:70px;
    height:60px;
    z-index:0;
    opacity:0.5;
    filter:blur(0.3px);
  }
  .barn-body{
    position:absolute;
    bottom:0;
    width:100%;
    height:70%;
    background:#b23b2e;
    border-radius:3px;
  }
  .barn-roof{
    position:absolute;
    top:0;
    width:0;
    height:0;
    border-left:38px solid transparent;
    border-right:38px solid transparent;
    border-bottom:26px solid #7a2820;
    left:-3px;
  }
  .barn-door{
    position:absolute;
    bottom:0;
    left:50%;
    width:20px;
    height:60%;
    background:#5c1e18;
    transform:translateX(-50%);
    border-radius:10px 10px 0 0;
  }

  /* cerca de madeira */
  .fence{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:46px;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    z-index:1;
    opacity:0.85;
    pointer-events:none;
  }
  .fence-post{
    width:8px;
    height:40px;
    background:linear-gradient(to bottom, var(--wood), var(--wood-dark));
    border-radius:2px 2px 0 0;
    box-shadow:0 4px 6px rgba(0,0,0,0.2);
  }

  /* nuvens */
  .cloud{
    position:absolute;
    background:rgba(255,255,255,0.85);
    border-radius:50px;
    filter:blur(1px);
    animation:drift linear infinite;
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,0.85);
    border-radius:50%;
  }
  @keyframes drift{
    from{transform:translateX(-150px);}
    to{transform:translateX(110vw);}
  }

  /* sol */
  .sun-wrap{
    position:absolute;
    top:6%;
    right:8%;
    width:90px;
    height:90px;
    z-index:0;
  }
  .sun-rays{
    position:absolute;
    inset:0;
    background:repeating-conic-gradient(from 0deg, rgba(255,224,120,0.55) 0deg 8deg, transparent 8deg 20deg);
    border-radius:50%;
    animation:spinRays 18s linear infinite;
  }
  @keyframes spinRays{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  .sun{
    position:absolute;
    top:18%;
    left:18%;
    width:64%;
    height:64%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fffbe6 0%, #ffe066 55%, #ffb300 100%);
    box-shadow:0 0 40px 20px rgba(255,204,51,0.55);
    animation:pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1); box-shadow:0 0 40px 20px rgba(255,204,51,0.55);}
    50%{transform:scale(1.1); box-shadow:0 0 55px 28px rgba(255,204,51,0.7);}
  }

  /* passaro */
  .bird{
    position:absolute;
    font-size:20px;
    animation:flyacross linear infinite, flap 0.5s ease-in-out infinite alternate;
    z-index:1;
  }
  @keyframes flyacross{
    from{transform:translate(-60px, 0);}
    to{transform:translate(110vw, -40px);}
  }
  @keyframes flap{
    from{transform:translateY(0) scaleY(1);}
    to{transform:translateY(-6px) scaleY(0.85);}
  }

  /* boi */
  .cow{
    position:absolute;
    width:110px;
    animation:walk linear infinite;
    z-index:1;
  }
  .cow-shadow{
    position:absolute;
    bottom:-6px;
    left:50%;
    width:70%;
    height:12px;
    background:radial-gradient(ellipse, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 75%);
    transform:translateX(-50%);
    animation:shadowPulse 0.42s ease-in-out infinite;
    z-index:0;
  }
  @keyframes shadowPulse{
    0%,100%{transform:translateX(-50%) scale(1); opacity:0.9;}
    50%{transform:translateX(-50%) scale(0.82); opacity:0.55;}
  }
  .cow img{
    display:block;
    width:100%;
    height:auto;
    position:relative;
    z-index:1;
    transform-origin:bottom center;
    animation:cowbob 0.42s cubic-bezier(.45,0,.55,1) infinite;
    filter:drop-shadow(0 6px 4px rgba(0,0,0,0.2));
  }
  @keyframes cowbob{
    0%{transform:translateY(0) scaleX(-1) rotate(0deg);}
    25%{transform:translateY(-7px) scaleX(-1) rotate(-1.5deg);}
    50%{transform:translateY(0) scaleX(-1) rotate(0deg);}
    75%{transform:translateY(-4px) scaleX(-1) rotate(1.5deg);}
    100%{transform:translateY(0) scaleX(-1) rotate(0deg);}
  }
  .cow.reverse img{
    animation-name:cowbobflip;
  }
  @keyframes cowbobflip{
    0%{transform:translateY(0) scaleX(1) rotate(0deg);}
    25%{transform:translateY(-7px) scaleX(1) rotate(1.5deg);}
    50%{transform:translateY(0) scaleX(1) rotate(0deg);}
    75%{transform:translateY(-4px) scaleX(1) rotate(-1.5deg);}
    100%{transform:translateY(0) scaleX(1) rotate(0deg);}
  }
  @keyframes walk{
    from{transform:translateX(-160px);}
    50.01%{transform:translateX(105vw);}
    50.02%{transform:translateX(105vw);}
    to{transform:translateX(-160px);}
  }
  .cow.reverse{
    animation-direction:alternate;
  }

  /* grama detalhes */
  .grass-tuft{
    position:absolute;
    bottom:0;
    width:14px;
    height:22px;
    background:var(--grass-dark);
    border-radius:50% 50% 0 0;
  }

  /* card central: placa de madeira de fazenda pendurada */
  .card-hanger{
    position:relative;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:cardIn 0.6s cubic-bezier(.34,1.56,.64,1), cardFloat 3.4s ease-in-out 0.6s infinite;
  }
  .ropes{
    display:flex;
    gap:120px;
    margin-bottom:-6px;
  }
  .rope{
    width:6px;
    height:34px;
    background:linear-gradient(180deg, #b8895a, #8a5a34);
    border-radius:3px;
    box-shadow:inset -2px 0 2px rgba(0,0,0,0.25);
  }
  .rope::before{
    content:"";
    display:block;
    width:16px;
    height:16px;
    margin:-8px 0 0 -5px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #cfa27a, #6b4423);
    box-shadow:0 2px 3px rgba(0,0,0,0.4);
  }
  .card{
    position:relative;
    background:
      repeating-linear-gradient(100deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 9px),
      linear-gradient(160deg, #c8965f 0%, #a9713f 45%, #8a5a34 100%);
    border-radius:20px;
    padding:42px 54px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.35), inset 0 0 0 6px rgba(255,255,255,0.08);
    max-width:90vw;
    border:5px solid var(--wood-dark);
    animation:cardGlow 2.6s ease-in-out 0.6s infinite;
  }
  .card::before, .card::after,
  .card .bolt{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f4e2c8, #7a5533);
    box-shadow:inset 0 0 2px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
  }
  .card::before{ top:14px; left:14px; }
  .card::after{ top:14px; right:14px; }
  .card .bolt.bl{ bottom:14px; left:14px; }
  .card .bolt.br{ bottom:14px; right:14px; }
  @keyframes cardIn{
    from{transform:scale(0.7) translateY(30px); opacity:0;}
    to{transform:scale(1) translateY(0); opacity:1;}
  }
  @keyframes cardFloat{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-9px) rotate(-0.4deg);}
  }
  @keyframes cardGlow{
    0%,100%{box-shadow:0 20px 50px rgba(0,0,0,0.35), inset 0 0 0 6px rgba(255,255,255,0.08), 0 0 0 rgba(255,204,51,0);}
    50%{box-shadow:0 26px 60px rgba(0,0,0,0.4), inset 0 0 0 6px rgba(255,255,255,0.08), 0 0 26px rgba(255,204,51,0.45);}
  }
  .card h1{
    margin:0 0 30px 0;
    font-family:'Baloo 2', 'Nunito', sans-serif;
    font-size:clamp(22px, 5.5vw, 40px);
    font-weight:800;
    color:#fff6e0;
    letter-spacing:0.3px;
    text-shadow:0 2px 0 rgba(0,0,0,0.45), 0 -1px 0 rgba(255,255,255,0.15);
  }
  .card h1 span{
    color:#ffd54f;
    display:inline-block;
    animation:wiggle 1.8s ease-in-out infinite;
  }
  .card .subtitle{
    margin:-18px 0 22px 0;
    font-size:14px;
    font-weight:700;
    color:#fff0d2;
    opacity:0.85;
    letter-spacing:0.2px;
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(0deg);}
    10%{transform:rotate(-6deg);}
    20%{transform:rotate(6deg);}
    30%{transform:rotate(-4deg);}
    40%{transform:rotate(0deg);}
  }
  .dodge-zone{
    position:relative;
    width:100%;
    min-height:150px;
    overflow:hidden;
  }
  .btn-row{
    display:flex;
    gap:30px;
    justify-content:center;
    align-items:center;
    position:relative;
    min-height:70px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Baloo 2', 'Nunito', sans-serif;
    font-size:21px;
    font-weight:700;
    padding:14px 34px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    letter-spacing:0.3px;
    position:relative;
    isolation:isolate;
    transition: transform 0.15s ease, box-shadow 0.15s ease, left 0.18s ease, top 0.18s ease;
    touch-action:manipulation;
  }
  button::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:repeating-linear-gradient(95deg, rgba(255,255,255,0.12) 0px, rgba(255,255,255,0.12) 2px, transparent 2px, transparent 7px);
    z-index:-1;
  }
  #simBtn{
    background:linear-gradient(180deg, #7cc576 0%, #4c9a3f 55%, #3f7f34 100%);
    color:#fff6e0;
    border:2px solid #2e6b26;
    box-shadow:0 6px 0 #2e5e26, 0 10px 18px rgba(46,112,49,0.35);
    text-shadow:0 1px 1px rgba(0,0,0,0.35);
    animation:simPulse 1.6s ease-in-out infinite;
  }
  @keyframes simPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  #simBtn:hover{
    transform:translateY(-2px) scale(1.06);
    box-shadow:0 8px 0 #2e5e26, 0 12px 20px rgba(46,112,49,0.4);
  }
  #simBtn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #2e5e26;
  }
  #naoBtn{
    background:linear-gradient(180deg, #e2694a 0%, #b8432b 55%, #96351f 100%);
    color:#fff6e0;
    border:2px solid #6e2413;
    box-shadow:0 6px 0 #6e2413, 0 10px 18px rgba(110,36,19,0.4);
    text-shadow:0 1px 1px rgba(0,0,0,0.35);
    position:absolute;
    transition: left 0.18s ease, top 0.18s ease, transform 0.15s ease;
  }

  /* popup */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    animation:fadeIn 0.25s ease;
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  .overlay.show{
    display:flex;
  }
  .popup{
    position:relative;
    background:linear-gradient(180deg, #ffffff 0%, #f3fff2 100%);
    padding:40px 50px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    animation:popBounce 0.6s cubic-bezier(.34,1.56,.64,1), borderPulse 1.8s ease-in-out 0.6s infinite;
    border:4px solid #dff0d8;
    overflow:visible;
  }
  @keyframes borderPulse{
    0%,100%{border-color:#dff0d8; box-shadow:0 20px 60px rgba(0,0,0,0.4);}
    50%{border-color:#9be08a; box-shadow:0 20px 60px rgba(0,0,0,0.4), 0 0 30px rgba(76,175,80,0.5);}
  }
  .confetti{
    position:absolute;
    top:-10px;
    font-size:20px;
    animation:confettiFall 1.6s ease-in forwards;
    pointer-events:none;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg) scale(1); opacity:1;}
    100%{transform:translateY(220px) rotate(520deg) scale(0.6); opacity:0;}
  }
  @keyframes popBounce{
    0%{transform:scale(0.3) rotate(-8deg); opacity:0;}
    55%{transform:scale(1.12) rotate(3deg); opacity:1;}
    75%{transform:scale(0.95) rotate(-2deg);}
    100%{transform:scale(1) rotate(0deg);}
  }
  .icon-wrap{
    position:relative;
    display:inline-block;
    margin-bottom:12px;
  }
  .icon-ring{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:3px solid #66bb6a;
    animation:ringPulse 1.6s ease-out infinite;
  }
  .icon-ring.delay{
    animation-delay:0.8s;
  }
  @keyframes ringPulse{
    0%{transform:scale(0.5); opacity:0.8;}
    100%{transform:scale(1.8); opacity:0;}
  }
  .popup .popup-icon{
    position:relative;
    font-size:50px;
    display:block;
    animation:iconBounce 0.9s cubic-bezier(.34,1.56,.64,1) infinite;
  }
  @keyframes iconBounce{
    0%,100%{transform:translateY(0) rotate(-10deg) scale(1);}
    30%{transform:translateY(-14px) rotate(8deg) scale(1.1);}
    55%{transform:translateY(0) rotate(-6deg) scale(0.96);}
    75%{transform:translateY(-4px) rotate(4deg) scale(1.03);}
  }
  .popup p{
    font-size:24px;
    font-weight:bold;
    color:#2e7031;
    margin:0 0 20px 0;
  }
  .popup p span{
    display:inline-block;
    animation:letterWave 1.2s ease-in-out infinite;
  }
  @keyframes letterWave{
    0%,60%,100%{transform:translateY(0);}
    30%{transform:translateY(-6px);}
  }
  .popup button{
    background:#43a047;
    color:white;
    box-shadow:0 5px 0 #2e7031;
    animation:simPulse 1.6s ease-in-out infinite;
  }

  /* mobile */
  @media (max-width: 600px){
    body{
      padding:14px;
    }
    .card-hanger{
      width:100%;
      max-width:360px;
    }
    .ropes{
      gap:min(52vw, 220px);
    }
    .rope{
      height:24px;
    }
    .card{
      padding:28px 20px 24px;
      border-radius:20px;
      width:100%;
    }
    .card::before, .card::after, .card .bolt{
      width:11px;
      height:11px;
    }
    .card::before, .card::after{ top:11px; }
    .card::before{ left:11px; }
    .card::after{ right:11px; }
    .card .bolt.bl{ bottom:11px; left:11px; }
    .card .bolt.br{ bottom:11px; right:11px; }
    .card h1{
      margin-bottom:6px;
      font-size:clamp(20px, 6.6vw, 27px);
      line-height:1.25;
    }
    .card .subtitle{
      margin:0 0 18px 0;
      font-size:12.5px;
    }
    .barn{
      width:46px;
      height:40px;
      bottom:12%;
      left:3%;
    }
    .barn-roof{
      border-left-width:25px;
      border-right-width:25px;
      border-bottom-width:17px;
      left:-2px;
    }
    .dodge-zone{
      min-height:clamp(130px, 42vh, 190px);
    }
    .btn-row{
      gap:16px;
      min-height:56px;
    }
    button{
      font-size:17px;
      padding:13px 24px;
      border-radius:12px;
      min-height:48px;
    }
    .sun-wrap{
      width:48px;
      height:48px;
      top:3%;
      right:5%;
    }
    .fence{
      height:28px;
    }
    .fence-post{
      width:6px;
      height:24px;
    }
    .cow{
      width:70px;
    }
    .popup{
      padding:28px 26px;
      max-width:88vw;
    }
    .popup p{
      font-size:19px;
    }
    .popup .popup-icon{
      font-size:40px;
    }
  }

  @media (max-width: 420px){
    .barn{ display:none; }
  }

  @media (max-width: 340px){
    .card{ padding:22px 16px 20px; }
    .card h1{ font-size:19px; }
    button{ font-size:15px; padding:11px 18px; }
  }

  @media (max-height: 480px) and (orientation: landscape){
    body{ align-items:center; padding:10px; }
    .ropes{ display:none; }
    .card{ padding:16px 22px; }
    .card h1{ margin-bottom:12px; font-size:19px; }
    .dodge-zone{ min-height:90px; }
    .sun-wrap{ width:40px; height:40px; }
  }
</style>
</head>
<body>

  <div id="scene">
    <div class="hill h1"></div>
    <div class="hill h2"></div>
    <div class="barn">
      <div class="barn-roof"></div>
      <div class="barn-body"><div class="barn-door"></div></div>
    </div>
  </div>
  <div class="fence" id="fence"></div>

  <div class="card-hanger">
    <div class="ropes"><div class="rope"></div><div class="rope"></div></div>
    <div class="card">
      <span class="bolt bl"></span><span class="bolt br"></span>
      <h1>Dio é realmente <span>gado</span>?</h1>
      <p class="subtitle">🐄 Só clique se aguentar a resposta...</p>
      <div class="dodge-zone" id="dodgeZone">
        <div class="btn-row">
          <button id="simBtn">🌾 Sim</button>
        </div>
        <button id="naoBtn">🚫 Não</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="popup">
      <span class="icon-wrap">
        <span class="icon-ring"></span>
        <span class="icon-ring delay"></span>
        <span class="popup-icon">🐮</span>
      </span>
      <p id="popupText"></p>
      <button id="closeBtn">Fechar</button>
    </div>
  </div>

<script>
  const scene = document.getElementById('scene');

  // sol
  const sunWrap = document.createElement('div');
  sunWrap.className = 'sun-wrap';
  sunWrap.innerHTML = `<div class="sun-rays"></div><div class="sun"></div>`;
  scene.appendChild(sunWrap);

  // passaros
  function createBird(top, duration, delay){
    const b = document.createElement('div');
    b.className = 'bird';
    b.style.top = top + '%';
    b.style.animationDuration = `${duration}s, 0.5s`;
    b.style.animationDelay = `${delay}s, 0s`;
    b.textContent = '🐦';
    scene.appendChild(b);
  }
  for(let i=0;i<3;i++){
    createBird(8 + Math.random()*20, 18 + Math.random()*10, -Math.random()*20);
  }

  // gerar bois
  function createCow(top, duration, delay, scale, reverse){
    const cow = document.createElement('div');
    cow.className = 'cow' + (reverse ? ' reverse' : '');
    cow.style.top = top + '%';
    cow.style.transform = `scale(${scale})`;
    cow.style.animationDuration = duration + 's';
    cow.style.animationDelay = delay + 's';

    cow.innerHTML = `<div class="cow-shadow"></div><img src="cow.png" alt="boi">`;
    const img = cow.querySelector('img');
    const shadow = cow.querySelector('.cow-shadow');
    const bobDuration = (0.36 + Math.random()*0.14).toFixed(2);
    img.style.animationDuration = bobDuration + 's';
    shadow.style.animationDuration = bobDuration + 's';
    scene.appendChild(cow);
  }

  const cowSpots = [58, 65, 72, 80, 88];
  for(let i=0;i<9;i++){
    const top = cowSpots[i % cowSpots.length] + (Math.random()*4 - 2);
    const depth = (top - 55) / 35; // 0 = fundo, 1 = frente
    const duration = 22 - depth*10 + Math.random()*3;
    const delay = -Math.random()*duration;
    const scale = 0.6 + depth*0.55;
    createCow(top, duration, delay, scale, Math.random() > 0.5);
  }

  // nuvens
  function createCloud(top, width, duration, delay){
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.top = top + '%';
    c.style.width = width + 'px';
    c.style.height = (width*0.4) + 'px';
    c.style.animationDuration = duration + 's';
    c.style.animationDelay = delay + 's';
    scene.appendChild(c);
  }
  for(let i=0;i<5;i++){
    createCloud(5 + Math.random()*35, 80 + Math.random()*80, 40 + Math.random()*30, -Math.random()*40);
  }

  // postes da cerca
  const fence = document.getElementById('fence');
  for(let i=0;i<22;i++){
    const p = document.createElement('div');
    p.className = 'fence-post';
    fence.appendChild(p);
  }

  // tufos de grama
  for(let i=0;i<40;i++){
    const t = document.createElement('div');
    t.className = 'grass-tuft';
    t.style.left = (Math.random()*100) + '%';
    t.style.height = (14 + Math.random()*16) + 'px';
    scene.appendChild(t);
  }

  // botão "Não" foge do mouse, sempre dentro do card
  const naoBtn = document.getElementById('naoBtn');
  const simBtn = document.getElementById('simBtn');
  const dodgeZone = document.getElementById('dodgeZone');

  function placeNao(x, y){
    const zoneRect = dodgeZone.getBoundingClientRect();
    const btnW = naoBtn.offsetWidth || 90;
    const btnH = naoBtn.offsetHeight || 50;
    const maxX = Math.max(zoneRect.width - btnW, 0);
    const maxY = Math.max(zoneRect.height - btnH, 0);
    const clampedX = Math.min(Math.max(x, 0), maxX);
    const clampedY = Math.min(Math.max(y, 0), maxY);
    naoBtn.style.left = clampedX + 'px';
    naoBtn.style.top = clampedY + 'px';
  }

  function initNaoPosition(){
    const zoneRect = dodgeZone.getBoundingClientRect();
    const simRect = simBtn.getBoundingClientRect();
    const btnW = naoBtn.offsetWidth || 90;
    const startX = (simRect.right - zoneRect.left) + 20;
    const startY = (simRect.top - zoneRect.top);
    placeNao(startX, startY);
  }

  function jump(){
    const zoneRect = dodgeZone.getBoundingClientRect();
    const btnW = naoBtn.offsetWidth || 90;
    const btnH = naoBtn.offsetHeight || 50;
    const maxX = Math.max(zoneRect.width - btnW, 0);
    const maxY = Math.max(zoneRect.height - btnH, 0);
    placeNao(Math.random() * maxX, Math.random() * maxY);
  }

  window.addEventListener('load', initNaoPosition);
  window.addEventListener('resize', initNaoPosition);
  initNaoPosition();

  function dodge(e){
    const btnRect = naoBtn.getBoundingClientRect();
    const mouseX = e.clientX;
    const mouseY = e.clientY;

    const btnCenterX = btnRect.left + btnRect.width/2;
    const btnCenterY = btnRect.top + btnRect.height/2;
    const dist = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);

    if(dist < 90){
      jump();
    }
  }

  document.addEventListener('mousemove', dodge);
  naoBtn.addEventListener('mouseover', dodge);

  document.addEventListener('touchmove', function(e){
    const touch = e.touches[0];
    if(!touch) return;
    const btnRect = naoBtn.getBoundingClientRect();
    const btnCenterX = btnRect.left + btnRect.width/2;
    const btnCenterY = btnRect.top + btnRect.height/2;
    const dist = Math.hypot(touch.clientX - btnCenterX, touch.clientY - btnCenterY);
    if(dist < 70){
      jump();
    }
  }, {passive:true});

  naoBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    jump();
  }, {passive:false});

  // popup ao clicar em Sim
  const overlay = document.getElementById('overlay');
  const popup = document.querySelector('.popup');

  // texto animado letra a letra
  const popupText = document.getElementById('popupText');
  const messageText = 'Ainda bem que sabe ...';
  messageText.split('').forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.animationDelay = (i * 0.05) + 's';
    popupText.appendChild(s);
  });

  function burstConfetti(){
    const emojis = ['🎉','✨','🐮','🌟','🎊'];
    for(let i=0;i<14;i++){
      const c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      c.style.left = (Math.random()*100) + '%';
      c.style.animationDelay = (Math.random()*0.3) + 's';
      c.style.fontSize = (14 + Math.random()*14) + 'px';
      popup.appendChild(c);
      setTimeout(() => c.remove(), 1800);
    }
  }
  let confettiInterval = null;
  simBtn.addEventListener('click', () => {
    overlay.classList.add('show');
    burstConfetti();
    confettiInterval = setInterval(burstConfetti, 1600);
  });
  document.getElementById('closeBtn').addEventListener('click', () => {
    overlay.classList.remove('show');
    clearInterval(confettiInterval);
  });
</script>
</body>
</html>
